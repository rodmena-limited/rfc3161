[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rodmena-rfc3161"
version = "0.1.0"
description = "A small RFC 3161 time-stamp client: request, response and token verification"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/rodmena_rfc3161"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]
"tools/*" = ["S310", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
